<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组件摆放计算器</title>
<style>
:root {
  color-scheme: light;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  color: #17243b;
  background: #edf1f6;
  font-synthesis: none;
  font-weight: 400;
  line-height: 1.45;
  --blue: #2956dc;
  --blue-dark: #2146b9;
  --muted: #52627a;
  --line: #e4eaf2;
  --slate: #101e34;
  --red: #bd3f58;
  --green: #14794f;
  --yellow: #82630c;
  --orange: #ad4d20;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
button, input, select { font: inherit; }
button, select, input[type="checkbox"] { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid #4676ff;
  outline-offset: 2px;
}
button:disabled { cursor: default; opacity: .51; }
h1, h2, p { margin: 0; }
.workspace { max-width: 1136px; margin: 0 auto; padding: 42px 30px 54px; }
.page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 27px;
}
.presets { display: grid; grid-template-columns: repeat(5, auto); align-items: center; gap: 6px; }
.presets-label { padding-inline-end: 6px; color: var(--muted); font-size: 0.875rem; font-weight: 650; white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 15px; }
.brand-mark {
  width: 52px;
  height: 52px;
  flex: 0 0 52px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 10px;
  background: #172d50;
  border-radius: 15px;
  box-shadow: 0 3px 8px #15284322;
}
.brand-mark i { background: #91b3ff; border-radius: 3px; }
.brand-mark i:nth-child(2) { background: #82d9b3; }
.brand-mark i:nth-child(3) { background: #ffd585; }
.brand-mark i:nth-child(4) { background: #f39a85; }
h1 { font-size: clamp(1.75rem, 3.3vw, 2.375rem); line-height: 1.24; letter-spacing: -.035em; }
.page-head p { color: var(--muted); margin-top: 5px; font-size: 1rem; }
.layout { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); align-items: start; gap: 21px; }
.config, .results { display: grid; gap: 16px; min-width: 0; }
.card {
  min-width: 0;
  padding: 19px 21px 17px;
  border: 1px solid #dfe6ef;
  border-radius: 19px;
  background: #fff;
  box-shadow: 0 2px 5px #182b4b06;
}
.card-head { margin-bottom: 13px; }
h2 { font-size: 1.3125rem; font-weight: 720; letter-spacing: -.022em; }
.card-head p, .hint { color: var(--muted); font-size: 0.875rem; }
.card-head p { margin-top: 4px; }
.hint { margin-top: 10px; line-height: 1.55; }
.target-row, .stock-head, .stock-row { display: grid; align-items: center; gap: 7px; }
.target-table { container-type: inline-size; }
.target-row { grid-template-columns: max-content minmax(80px, 1fr) minmax(146px, 2fr) minmax(80px, 1fr); }
.target-group { min-width: 0; margin: 0; padding: 4px 6px 7px; border: 1px solid #dce4ee; border-radius: 8px; background: #f7f9fc; }
.target-group legend { padding: 0 3px; font-size: 0.875rem; font-weight: 700; color: #344965; }
.target-group.required { border-color: #ccdafa; background: #f2f6ff; }
.target-group.extra { border-color: #cce6db; background: #f2f9f5; }
.target-fields { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 5px; }
.stock-head {
  color: #53627a;
  background: #f2f5f9;
  border-radius: 8px;
  min-height: 32px;
  padding: 0 8px;
  font-size: 0.8125rem;
  font-weight: 650;
}
.stock-head span:not(:first-child) { text-align: center; }
.target-row, .stock-row { border-bottom: 1px solid #edf1f6; padding: 6px 8px; min-height: 46px; }
.color-name, .kind-name { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 0.9375rem; }
.color-dot { width: 11px; height: 11px; border-radius: 4px; flex: 0 0 11px; background: var(--tone); }
.red { --tone: var(--red); --tile-bg: #592d3a; --tile-edge: #9f5364; --tile-text: #ffdce1; }
.green { --tone: var(--green); --tile-bg: #1f4b3f; --tile-edge: #418870; --tile-text: #c8f8de; }
.yellow { --tone: var(--yellow); --tile-bg: #534722; --tile-edge: #9b823e; --tile-text: #ffedb5; }
.orange { --tone: var(--orange); --tile-bg: #593726; --tile-edge: #a76543; --tile-text: #ffdac1; }
.color-dot.yellow { background: #b18a21; }
select {
  color: #17243b;
  height: 32px;
  min-width: 0;
  border: 1px solid #d8e1ec;
  border-radius: 7px;
  background: #fff;
}
.setting-value {
  display: grid;
  place-items: center;
  color: #17243b;
  background: #fff;
  font-size: 0.875rem;
  font-variant-numeric: tabular-nums;
}
.target-caption, .target-group.minimum .target-field::before { display: block; margin-bottom: 3px; font-size: 0.8125rem; }
.target-caption { color: #52627a; font-weight: 650; }
.number-control {
  display: grid;
  grid-template-columns: minmax(20px, .7fr) minmax(18px, 1fr) minmax(20px, .7fr);
  min-height: 34px;
  border: 1px solid #d8e1ec;
  border-radius: 7px;
}
.number-step {
  padding: 0;
  border: 0;
  color: #365784;
  background: #f5f8fd;
  font-size: 1.0625rem;
  line-height: 1;
}
.number-step:first-child { border-right: 1px solid #e3eaf4; border-radius: 6px 0 0 6px; }
.number-step:last-child { border-left: 1px solid #e3eaf4; border-radius: 0 6px 6px 0; }
.number-step:hover:not(:disabled) { background: #e7efff; }
.number-step:disabled { color: #8d9bb1; }
.number-control :focus-visible { outline-offset: -2px; }
@container (min-width: 351px) {
  .target-group.minimum .target-field::before { content: ""; height: 1lh; }
}
@container (min-width: 461px) {
  .color-name { flex-direction: column; gap: 3px; }
}
@container (min-width: 351px) and (max-width: 460px) {
  .target-row { grid-template-columns: minmax(80px, 1fr) minmax(146px, 2fr) minmax(80px, 1fr); }
  .color-name { grid-column: 1 / -1; }
}
@container (max-width: 350px) {
  .target-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .target-group.extra .target-field { display: grid; grid-template-columns: 1fr 1fr; align-items: center; }
}
.stock-table { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); gap: 8px; }
.stock-head, .stock-row { grid-template-columns: minmax(70px, 1.5fr) repeat(2, minmax(22px, 1fr)); gap: 4px; padding-inline: 4px; }
.stock-head .stock-blue { color: var(--blue); }
.stock-head .stock-orange { color: var(--orange); }
.kind-name { gap: 6px; white-space: nowrap; }
.kind-name .item-icon { width: 32px; height: 32px; }
.stock-title-row { display: flex; align-items: center; justify-content: space-between; }
.stock-row { min-height: 39px; padding-block: 3px; }
.item-icon { display: block; width: 36px; height: 36px; flex: none; border-radius: 7px; }
.tile .item-icon { width: min(64%, 52px); height: auto; aspect-ratio: 1; }
.stock-toggle { display: grid; place-items: center; min-height: 29px; cursor: pointer; }
.stock-toggle:hover { background: #f0f4fd; border-radius: 7px; }
.stock-toggle input { margin: 0; width: 18px; height: 18px; accent-color: var(--blue); }
.pref-row { display: grid; grid-template-columns: 1fr minmax(144px, 1fr); align-items: center; gap: 8px; min-height: 43px; }
.pref-row label { font-size: 0.9375rem; font-weight: 650; }
.pref-row select { width: 100%; padding: 0 8px; color: #ecf4ff; border-color: #557299; background: #2c4263; color-scheme: dark; font-size: 0.875rem; }
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 9px;
  min-height: 36px;
  padding: 0 13px;
  font-size: 0.9375rem;
  font-weight: 680;
  white-space: nowrap;
  transition: background-color .15s, border-color .15s;
}
.secondary { background: #fff; border-color: #dce4ef; color: #264266; }
.secondary:hover { background: #f4f7fc; border-color: #c8d6ea; }
.board-card {
  min-width: 0;
  padding: 20px;
  border: 1px solid #253b5b;
  border-radius: 20px;
  color: #f2f6ff;
  background: linear-gradient(153deg, #1c304f 0%, #14253f 57%, #15243c 100%);
  box-shadow: 0 10px 27px #12234128;
}
.board-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; margin-bottom: 11px; }
.board-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.goal-met { padding: 3px 8px; border: 1px solid #447f6c; border-radius: 999px; background: #214d43; color: #c1f1d9; font-size: .8125rem; font-weight: 650; white-space: nowrap; }
.goal-met.unmet { border-color: #866641; background: #503c28; color: #ffddab; }
.board-head h2 { font-size: 1.4375rem; }
.status {
  display: inline-block;
  flex: 0 0 auto;
  border: 1px solid #455f87;
  background: #293f60;
  color: #e2ecff;
  border-radius: 100px;
  padding: 4px 9px;
  margin-top: 3px;
  font-size: 0.8125rem;
  font-weight: 650;
}
.status[data-kind="good"] { background: #214d43; color: #c1f1d9; border-color: #447f6c; }
.status[data-kind="warn"] { background: #574022; color: #ffde9d; border-color: #85663c; }
.status[data-kind="busy"] { background: #284c8a; color: #e2ebff; border-color: #587cc1; }
.board-frame {
  display: grid;
  grid-template-columns: 17px repeat(5, minmax(0, 1fr));
  gap: 5px;
  max-width: 455px;
  margin: 0 auto;
  padding: 3px 8px 8px 2px;
  border: 1px solid #334965;
  border-radius: 13px;
  background: #0b182c;
}
.board-frame.is-searching {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-color: #69dbff;
  box-shadow: 0 0 0 2px #52ccff35, 0 0 22px #36afff55;
}
@media (prefers-reduced-motion: no-preference) {
  .board-frame.is-searching::after {
    content: "";
    position: absolute;
    z-index: 4;
    inset: 0 0 auto;
    height: 26%;
    pointer-events: none;
    background: linear-gradient(180deg, transparent, #719dff12 38%, #62dfff52 95%, #b6ffffb3);
    border-bottom: 1px solid #b6ffff;
    animation: board-scan 1.65s linear infinite;
  }
  .status[data-kind="busy"]::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 6px;
    vertical-align: -2px;
    border: 2px solid #75bdff55;
    border-top-color: #acffff;
    border-right-color: #acffff;
    border-radius: 50%;
    animation: status-spin .8s linear infinite;
  }
  @keyframes board-scan {
    from { transform: translateY(-100%); }
    to { transform: translateY(390%); }
  }
  @keyframes status-spin { to { transform: rotate(1turn); } }
}
.axis { display: grid; place-items: center; color: #91a6c6; font-size: 0.8125rem; line-height: 18px; user-select: none; }
.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1px solid var(--tile-edge, #283e5c);
  box-shadow: inset 0 2px #fff0;
  background: var(--tile-bg, #162741);
  color: var(--tile-text, #9eb3d1);
  min-width: 0;
  min-height: 0;
  padding: 2px;
  line-height: 1.03;
  transition: filter .15s, box-shadow .15s;
}
.tile.connected-right::after, .tile.connected-down::before {
  position: absolute;
  z-index: 2;
  display: block;
  background: var(--tile-edge);
  pointer-events: none;
  content: "";
}
.tile.connected-right::after { width: 7px; height: 5px; top: calc(50% - 2px); right: -7px; }
.tile.connected-down::before { width: 5px; height: 7px; left: calc(50% - 2px); bottom: -7px; }
.tile.amplifier { --tile-bg: #173e60; --tile-edge: #397aa5; --tile-text: #c3eaff; }
.tile-level, .tile-glyph { font-size: clamp(1.25rem, 3.4vw, 1.75rem); font-weight: 740; line-height: 1.03; }
.tile-caption { margin-top: 3px; font-size: 0.75rem; font-weight: 650; }
.role-mark {
  position: absolute;
  top: 4px;
  right: 4px;
  border-radius: 4px;
  padding: 2px 3px;
  background: #edda9c;
  color: #382c15;
  font-size: 0.6875rem;
  font-weight: 750;
}
.role-mark.soft { background: #bfdcfd; color: #1b3d68; }
.role-mark.miss { background: #ffd2d5; color: #7a222a; }
.board-actions { display: flex; gap: 8px; margin-top: 11px; }
.board-actions .button { min-height: 39px; }
.primary { flex: 1; background: #a4bdff; color: #142e6e; }
.primary:hover { background: #c5d4ff; }
.board-secondary { flex: 1; border-color: #557299; color: #ecf4ff; background: #2c4263; }
.board-secondary:hover { background: #39557e; }
.run-note { min-height: 17px; margin: 10px 0 0; color: #c2d1e8; font-size: 0.8125rem; line-height: 1.55; }
.run-note:is([data-kind="search"], [data-kind="verify"]) {
  --signal: #65eeef;
  position: relative;
  overflow: hidden;
  padding: 4px 0 10px;
  color: #dfedff;
}
.run-note[data-kind="verify"] { --signal: #b5a2ff; }
.run-note:is([data-kind="search"], [data-kind="verify"])::before,
.run-note:is([data-kind="search"], [data-kind="verify"])::after {
  content: "";
  position: absolute;
  bottom: 2px;
  left: 0;
  height: 3px;
  border-radius: 3px;
}
.run-note::before {
  width: 100%;
  background: repeating-linear-gradient(90deg, #6683ab58 0 6px, transparent 6px 9px);
}
.run-note::after {
  width: 28%;
  background: linear-gradient(90deg, transparent, var(--signal) 76%, #f3fdff);
  filter: drop-shadow(0 0 3px var(--signal));
}
@media (prefers-reduced-motion: no-preference) {
  .run-note[data-kind="search"]::after { animation: search-sweep 1.55s linear infinite; }
  .run-note[data-kind="verify"]::after {
    background: linear-gradient(90deg, transparent, var(--signal) 38%, #f3fdff 50%, var(--signal) 62%, transparent);
    animation: verify-sweep 2.2s ease-in-out infinite alternate;
  }
  @keyframes search-sweep { from { transform: translateX(-100%); } to { transform: translateX(360%); } }
  @keyframes verify-sweep { from { transform: translateX(0); } to { transform: translateX(257%); } }
}
.run-note[data-kind="warn"] { color: #ffda99; }
.overview { padding-block: 14px; }
.overview h2 { font-size: 1.125rem; margin-bottom: 9px; }
.quiet { color: #2b55b6; background: #eef3ff; min-height: 29px; font-size: 0.875rem; padding: 0 9px; }
.quiet:hover { background: #dfe9ff; }
.metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid #e4eaf3; border-radius: 10px; background: #f7f9fc; }
.metrics > div { display: flex; flex-direction: column; text-align: center; gap: 2px; padding: 7px 2px; }
.metrics > div + div { border-left: 1px solid #e4eaf3; }
.metrics strong { font-size: 1.3125rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.metrics span { font-size: 0.75rem; color: #53647c; }
.summary { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.summary caption { text-align: left; font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
.summary th, .summary td { padding: 6px 2px; text-align: center; border-bottom: 1px solid #e4eaf3; }
.summary thead th { background: #f2f5fa; color: #50617a; font-size: 0.8125rem; white-space: nowrap; }
.summary th:first-child { text-align: left; padding-left: 5px; }
.summary tbody th { white-space: nowrap; font-size: 0.875rem; }
.summary td { font-weight: 700; }
.summary td.empty { color: #aab4c3; font-weight: 400; }
.summary .color-dot { display: inline-block; width: 8px; height: 8px; margin-right: 5px; }
@media (min-width: 880px) and (min-height: 840px) { .results { position: sticky; top: 16px; } }
@media (max-width: 865px) {
  .workspace { padding: 28px 19px 38px; }
  .layout { gap: 13px; }
  .card, .board-card { padding-inline: 13px; }
}
@media (max-width: 860px) {
  .workspace { max-width: 640px; }
  .layout { grid-template-columns: 1fr; }
  .results { margin-top: 3px; }
  .setting-value, .pref-row select { font-size: 1rem; }
  .stock-toggle, .button, .board-actions .button, .pref-row select { min-height: 44px; }
  .stock-toggle input { width: 20px; height: 20px; }
  .tile .item-icon { width: min(56%, 52px); }
  .page-head { margin-bottom: 20px; gap: 8px; }
  .page-head p { font-size: 0.875rem; }
  .brand { gap: 9px; }
  .brand-mark { width: 37px; height: 37px; flex-basis: 37px; border-radius: 10px; padding: 7px; gap: 3px; }
  .page-head { flex-wrap: wrap; }
  .presets { width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .presets-label { grid-column: 1 / -1; }
  .tile-level, .tile-glyph { font-size: clamp(1.25rem, 5.6vw, 1.75rem); }
}
@media (max-width: 480px) {
  .workspace { padding: 20px 10px 32px; }
  .brand { flex: 1 1 200px; }
  .summary-wrap { overflow-x: auto; }
  .summary { min-width: 305px; }
  .metrics > div { padding: 9px 4px; }
  .tile-caption { white-space: nowrap; }
}
@media (max-width: 370px) {
  .workspace { padding-inline: 10px; }
  h1 { font-size: 1.4375rem; }
  .brand-mark { display: none; }
  .role-mark { top: 2px; right: 2px; padding: 1px 2px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}

</style>
</head>
<body>
<main class="workspace">
  <header class="page-head">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div>
        <h1>组件摆放计算器</h1>
        <p>配置组件目标和增幅器库存，计算 5 × 5 棋盘方案。</p>
      </div>
    </div>
    <div class="presets" role="group" aria-labelledby="presets-label">
      <span class="presets-label" id="presets-label">查看示例</span>
      <button type="button" data-preset="healthIdle" class="button secondary">体力挂机</button>
      <button type="button" data-preset="healthArena" class="button secondary">体力jjc</button>
      <button type="button" data-preset="attackIdle" class="button secondary">攻击挂机</button>
      <button type="button" data-preset="attackArena" class="button secondary">攻击jjc</button>
    </div>
  </header>

  <div class="layout">
    <form id="settings" class="config" novalidate>
      <section class="card" aria-labelledby="target-title">
        <div class="card-head">
          <h2 id="target-title">组件目标</h2>
          <p>每色最多 7 个。同色组件要通过上下左右连成一块。</p>
        </div>
        <div class="target-table">
          <div id="targets"></div>
        </div>
      </section>

      <section class="card" aria-labelledby="stock-title">
        <div class="card-head">
          <div class="stock-title-row"><h2 id="stock-title">增幅器库存</h2><button type="button" id="select-all-amps" class="button quiet">全选</button></div>
          <p>勾选你持有的版本。每种范围各有一个，计算时按需使用。</p>
        </div>
        <div class="stock-table" id="inventory"></div>
      </section>
    </form>

    <aside class="results" aria-label="计算结果">
      <section class="board-card" aria-labelledby="board-title">
        <div class="board-head">
          <div class="board-heading">
            <h2 id="board-title">摆放方案</h2>
            <span id="goal-met" class="goal-met unmet">未满足要求</span>
          </div>
          <span id="status" class="status" role="status">等待计算</span>
        </div>
        <div class="board-frame" id="board" role="group" aria-label="5 行 5 列的摆放棋盘"></div>
        <p id="run-note" class="run-note">点击「开始计算」搜索并验证最优方案。</p>
        <div class="pref-row">
          <label for="priority">优化优先级</label>
          <select id="priority" name="priority" form="settings">
            <option value="count">尽量多放组件</option>
            <option value="level">尽量升高组件</option>
          </select>
        </div>
        <div class="board-actions">
          <button type="submit" id="solve" form="settings" class="button primary">开始计算</button>
          <button type="button" id="action" class="button board-secondary" hidden>停止计算</button>
        </div>
      </section>

      <section class="card overview" aria-labelledby="overview-title" id="overview" hidden>
        <h2 id="overview-title">目标完成情况</h2>
        <div class="metrics">
          <div><strong id="parts-metric">—</strong><span>组件数量</span></div>
          <div><strong id="hard-metric">—</strong><span>满足等级要求的组件</span></div>
          <div><strong id="soft-metric">—</strong><span>「尽量升高」等级合计</span></div>
        </div>
        <div class="summary-wrap">
        <table class="summary">
          <caption>各等级组件数量</caption>
          <thead><tr><th scope="col">颜色</th><th scope="col">7级</th><th scope="col">6级</th><th scope="col">5级</th><th scope="col">4级</th><th scope="col">3级</th><th scope="col">2级</th><th scope="col">1级</th><th scope="col">0级</th></tr></thead>
          <tbody id="summary"></tbody>
        </table>
        </div>
      </section>
    </aside>
  </div>
</main>
<script>
const amplifierKinds = [
  { name: '水平', short: '横', symbol: '↔', power: 2 },
  { name: '垂直', short: '竖', symbol: '↕', power: 2 },
  { name: '上', short: '上', symbol: '↑', power: 4 },
  { name: '下', short: '下', symbol: '↓', power: 4 },
  { name: '左', short: '左', symbol: '←', power: 4 },
  { name: '右', short: '右', symbol: '→', power: 4 },
  { name: '范围', short: '全', symbol: '✧', power: 1 },
  { name: '十字', short: '十', symbol: '✚', power: 1 }
];

function coversCell(type, distance, from, to) {
  const row = Math.floor(to / 5) - Math.floor(from / 5);
  const col = to % 5 - from % 5;
  if (row === 0 && col === 0) return false;
  switch (type) {
    case 0: return row === 0 && Math.abs(col) <= distance;
    case 1: return col === 0 && Math.abs(row) <= distance;
    case 2: return col === 0 && row < 0 && row >= -distance;
    case 3: return col === 0 && row > 0 && row <= distance;
    case 4: return row === 0 && col < 0 && col >= -distance;
    case 5: return row === 0 && col > 0 && col <= distance;
    case 7: return (row === 0 || col === 0) && Math.abs(row) + Math.abs(col) <= distance;
    default: return Math.max(Math.abs(row), Math.abs(col)) <= distance;
  }
}

function solverWorker(covered = coversCell, kinds = amplifierKinds) {
  const width = 5;
  const size = 25;
  const full = (1 << size) - 1;
  const powers = Array.from({ length: kinds.length * 2 }, (_, id) => kinds[id >> 1].power);
  const leftCol = 1082401;
  const rightCol = leftCol << 4;
  const snake = Array.from({ length: size }, (_, i) => {
    const row = Math.floor(i / width);
    return row * width + (row % 2 ? width - 1 - i % width : i % width);
  });
  const range = (length) => Array.from({ length }, (_, index) => index);

  function bitCount(value) {
    value -= (value >>> 1) & 0x55555555;
    value = (value & 0x33333333) + ((value >>> 2) & 0x33333333);
    return ((((value + (value >>> 4)) & 0x0f0f0f0f) * 0x01010101) >>> 24);
  }

  function adjacent(mask) {
    return (((mask & ~rightCol) << 1) | ((mask & ~leftCol) >>> 1)
      | (mask << width) | (mask >>> width)) & full;
  }

  function connectedPart(mask) {
    let reached = mask & -mask;
    while (true) {
      const next = reached | (adjacent(reached) & mask);
      if (next === reached) return reached;
      reached = next;
    }
  }

  function disconnectedCount(mask, count) {
    if (count < 2) return 0;
    const first = connectedPart(mask);
    if (first === mask) return 0;
    let largest = bitCount(first);
    mask ^= first;
    while (bitCount(mask) > largest) {
      const part = connectedPart(mask);
      largest = Math.max(largest, bitCount(part));
      mask ^= part;
    }
    return count - largest;
  }

  function setup(config) {
    const positions = range(size);
    const effects = range(powers.length).map(id => positions.map(from =>
      positions.filter(to => covered(id >> 1, id % 2 + 1, from, to))
    ));
    const held = config.held.slice();
    const impact = effects.map((byPosition, id) => Math.max(...byPosition.map(cells => cells.length)) * powers[id]);
    held.sort((a, b) => impact[b] - impact[a] || a - b);
    const hard = config.colors.map(color => color.hard.slice().sort((a, b) => b - a));
    const minimum = config.colors.map((color, i) => Math.max(color.min, hard[i].length + color.soft));
    const soft = config.colors.map(color => color.soft);
    const allHard = hard.flat().sort((a, b) => b - a);
    const totalSoft = soft.reduce((sum, count) => sum + count, 0);
    const hardEnergy = allHard.reduce((sum, level) => sum + level, 0);
    const origins = effects.map(byPosition => positions.map(target =>
      positions.reduce((mask, origin) => mask | (byPosition[origin].includes(target) ? 1 << origin : 0), 0)
    ));
    return { config, positions, effects, held, impact, hard, minimum, soft, allHard, totalSoft, hardEnergy, origins };
  }

  function objective(p, soft, count, total) {
    if (p.config.priority === 'count') return (count * 197 + soft) * 176 + total;
    return soft;
  }

  function matchLevels(histogram, hard, soft) {
    let missing = 0;
    let deficit = 0;
    let highMissing = 0;
    // Satisfy stricter targets first using the lowest eligible level.
    for (const level of hard) {
      let used = level;
      while (used <= 7 && !histogram[used]) used++;
      if (used <= 7) histogram[used]--;
      else {
        missing++;
        deficit += level;
        if (level > highMissing) highMissing = level;
      }
    }
    // Keep unmet targets separate from the pieces available for the soft targets.
    if (missing) {
      let reserved = 0;
      for (let level = highMissing - 1; level >= 0 && reserved < missing; level--) {
        const take = Math.min(histogram[level], missing - reserved);
        histogram[level] -= take;
        deficit -= take * level;
        reserved += take;
      }
    }
    let softScore = 0;
    for (let level = 7; level >= 0 && soft > 0; level--) {
      const taken = Math.min(histogram[level], soft);
      softScore += taken * level;
      soft -= taken;
    }
    return { missing, deficit, softScore };
  }

  function evaluator(p) {
    const counts = new Int8Array(4);
    const masks = new Int32Array(4);
    const gains = new Uint8Array(size);
    const histogram = range(4).map(() => new Int8Array(8));
    const metrics = {};
    return (board) => {
      gains.fill(0);
      counts.fill(0);
      masks.fill(0);
      for (const bucket of histogram) bucket.fill(0);
      for (let pos = 0; pos < size; pos++) {
        const id = board[pos] - 4;
        if (id < 0) continue;
        for (const to of p.effects[id][pos]) gains[to] += powers[id];
      }
      let count = 0;
      let total = 0;
      for (let pos = 0; pos < size; pos++) {
        const color = board[pos];
        if (color < 0 || color >= 4) continue;
        counts[color]++;
        masks[color] |= 1 << pos;
        const level = Math.min(7, gains[pos]);
        histogram[color][level]++;
        total += level;
        count++;
      }
      let missing = 0;
      let deficit = 0;
      let softScore = 0;
      let quantityGap = 0;
      let split = 0;
      for (let color = 0; color < 4; color++) {
        quantityGap += Math.max(0, p.minimum[color] - counts[color], counts[color] - 7);
        split += disconnectedCount(masks[color], counts[color]);
        const match = matchLevels(histogram[color], p.hard[color], p.soft[color]);
        missing += match.missing;
        deficit += match.deficit;
        softScore += match.softScore;
      }
      metrics.valid = quantityGap === 0 && split === 0 && missing === 0;
      metrics.near = quantityGap === 0 && split === 0;
      metrics.score = objective(p, softScore, count, total);
      metrics.shortage = missing * 192 + deficit;
      metrics.soft = softScore;
      metrics.count = count;
      metrics.total = total;
      metrics.missing = missing;
      metrics.deficit = deficit;
      metrics.quantityGap = quantityGap;
      metrics.split = split;
      return metrics;
    };
  }

  function plainBoard(p) {
    const counts = p.minimum.slice();
    let total = counts.reduce((sum, count) => sum + count, 0);
    for (let color = 0; color < 4 && total < size; color++) {
      const extra = Math.min(7 - counts[color], size - total);
      counts[color] += extra;
      total += extra;
    }
    const board = new Int8Array(size).fill(-1);
    let i = 0;
    for (let color = 0; color < 4; color++) {
      for (let n = 0; n < counts[color]; n++) board[snake[i++]] = color;
    }
    return board;
  }

  function upperBounds(p) {
    const minimumParts = p.minimum.reduce((sum, count) => sum + count, 0);
    const result = [];
    const maxima = p.positions.map(pos => p.held
      .map(id => p.origins[id][pos] ? powers[id] : 0)
      .sort((a, b) => b - a));
    const need = p.hardEnergy;
    let energy = 0;
    for (let n = 0; n <= Math.min(p.held.length, size - minimumParts); n++) {
      if (n) energy += p.impact[p.held[n - 1]];
      if (energy < need) {
        result.push(-1);
        continue;
      }
      const histogram = new Int8Array(8);
      let sum = 0;
      for (const strengths of maxima) {
        const cap = Math.min(7, strengths.slice(0, n).reduce((a, b) => a + b, 0));
        histogram[cap]++;
        sum += cap;
      }
      const match = matchLevels(histogram, p.allHard, p.totalSoft);
      if (match.missing) {
        result.push(-1);
        continue;
      }
      const count = size - n;
      const soft = Math.min(match.softScore, energy - need);
      result.push(objective(p, soft, count, Math.min(sum, count * 7, energy)));
    }
    return result;
  }

  function shuffle(values, random) {
    for (let i = values.length - 1; i > 0; i--) {
      const j = random(i + 1);
      [values[i], values[j]] = [values[j], values[i]];
    }
    return values;
  }

  function seedBoard(p, random, round, incumbent) {
    // A layout based on the reference screenshot seeds the first search.
    if (round === 0) {
      return Int8Array.from([
        1, 1, 15, 0, 0,
        11, 1, 1, 1, 7,
        2, 6, 17, 1, 1,
        2, 3, 5, 3, 3,
        3, 3, 3, 3, 9
      ], tile => tile >= 4 && !p.held.includes(tile - 4) ? -1 : tile);
    }
    if (incumbent && round % 4 !== 0) return Int8Array.from(incumbent.board);
    const board = new Int8Array(size).fill(-1);
    const slots = p.minimum.slice();
    let occupied = slots.reduce((sum, count) => sum + count, 0);
    const maxAmps = Math.min(p.held.length, size - occupied);
    const n = maxAmps > 0 ? 1 + random(maxAmps) : 0;
    const allowed = shuffle(p.held.slice(), random).slice(0, n);
    while (occupied < size - n) {
      const options = range(4).filter(color => slots[color] < 7);
      slots[options[random(options.length)]]++;
      occupied++;
    }
    const flip = random(8);
    const route = snake.map(pos => {
      let row = Math.floor(pos / width);
      let col = pos % width;
      if (flip & 1) row = width - 1 - row;
      if (flip & 2) col = width - 1 - col;
      return flip & 4 ? col * width + row : row * width + col;
    });
    const reserved = new Set(shuffle(p.positions.slice(), random).slice(0, n));
    let i = 0;
    for (const color of shuffle(range(4), random)) {
      for (let j = 0; j < slots[color]; j++) {
        while (reserved.has(route[i])) i++;
        board[route[i++]] = color;
      }
    }
    i = 0;
    for (const pos of reserved) board[pos] = 4 + allowed[i++];
    return board;
  }

  function heuristic(p, state, inspect, duration) {
    const deadline = performance.now() + duration;
    let seed = state.seed >>> 0 || 0x12345678;
    const unit = () => {
      seed ^= seed << 13;
      seed ^= seed >>> 17;
      seed ^= seed << 5;
      return (seed >>> 0) / 4294967296;
    };
    const random = n => Math.floor(unit() * n);
    const choices = [-1, 0, 1, 2, 3, ...p.held.map(id => id + 4)];
    const nearby = p.positions.map(pos => p.positions.filter(to => covered(6, 1, pos, to)));
    const prioritizeCount = p.config.priority === 'count';
    const batch = 9600;
    for (let round = 0; performance.now() < deadline && !state.proven; round++) {
      const reference = state.best || state.near;
      const restart = round + (state.continuing ? 1 : 0);
      const board = seedBoard(p, random, restart, reference);
      const softWeight = prioritizeCount ? 0.9 : 1.9 + (round % 4) * 0.8;
      const pressure = round % 6 === 4 ? 0.72 : 1;
      const energy = m => softWeight * m.soft
        + (prioritizeCount ? 2.15 * m.count + 0.17 * m.total : 0)
        - pressure * (m.quantityGap * 19 + m.split * 17 + m.missing * 14 + m.deficit * 4.2);
      let score = energy(inspect(board));
      const hot = restart % 4 === 0 ? 12 : 6.2;
      for (let step = 0; step < batch && !state.proven; step++) {
        if ((step & 255) === 0 && performance.now() >= deadline) return;
        const a = random(size);
        const oldA = board[a];
        const move = random(100);
        let b = -1;
        let oldB = -1;
        if (move < 32) {
          const replacement = choices[random(choices.length)];
          if (replacement === oldA || (replacement >= 4 && board.includes(replacement))) continue;
          board[a] = replacement;
        } else {
          b = move < 72 ? nearby[a][random(nearby[a].length)] : random(size);
          oldB = board[b];
          if (oldA === oldB) continue;
          board[a] = oldB;
          board[b] = oldA;
        }
        const nextScore = energy(inspect(board));
        state.tried++;
        const cooling = 1 - step / batch;
        const temperature = 0.37 + hot * cooling * cooling;
        if (nextScore >= score || unit() < Math.exp((nextScore - score) / temperature)) {
          score = nextScore;
        } else {
          board[a] = oldA;
          if (b >= 0) board[b] = oldB;
        }
        if ((state.tried & 16383) === 0) state.report();
      }
    }
  }

  function connectedMasks() {
    const bySize = [new Set([0]), new Set(range(size).map(pos => 1 << pos))];
    for (let count = 2; count <= 7; count++) {
      const next = new Set();
      for (const mask of bySize[count - 1]) {
        let frontier = adjacent(mask) & ~mask;
        while (frontier) {
          const bit = frontier & -frontier;
          next.add(mask | bit);
          frontier ^= bit;
        }
      }
      bySize.push(next);
    }
    return bySize.map(masks => Array.from(masks));
  }

  function* exhaustive(p, state, inspect, upper) {
    const groups = connectedMasks();
    const gains = new Uint8Array(size);
    const levelAt = new Uint8Array(size);
    const ampAt = new Int8Array(size).fill(-1);
    const ampCells = p.effects.map((byPosition, id) => p.positions.filter(pos => byPosition[pos].length)
      .sort((a, b) => byPosition[b].length - byPosition[a].length));
    const colors = range(4).sort((a, b) =>
      (p.hard[b][0] || 0) - (p.hard[a][0] || 0)
      || p.hard[b].length - p.hard[a].length || p.minimum[b] - p.minimum[a]);
    const suffix = [...colors.map(color => p.minimum[color]), 0];
    for (let i = 3; i >= 0; i--) suffix[i] += suffix[i + 1];
    const suffixHard = range(5).map(depth => colors.slice(depth).flatMap(color => p.hard[color]).sort((a, b) => b - a));
    const suffixSoft = range(5).map(depth => colors.slice(depth).reduce((sum, color) => sum + p.soft[color], 0));
    const selected = new Int32Array(4);
    let steps = 0;

    function tally(mask, histogram) {
      let total = 0;
      while (mask) {
        const bit = mask & -mask;
        const level = levelAt[31 - Math.clz32(bit)];
        histogram[level]++;
        total += level;
        mask ^= bit;
      }
      return total;
    }

    function publishLayout() {
      const board = ampAt.slice();
      for (let color = 0; color < 4; color++) {
        let mask = selected[color];
        while (mask) {
          const bit = mask & -mask;
          board[31 - Math.clz32(bit)] = color;
          mask ^= bit;
        }
      }
      inspect(board);
    }

    function* colorBoard(depth, left, count, soft, total) {
      if ((++steps & 1023) === 0) yield;
      if (state.proven) return;
      const available = bitCount(left);
      if (available < suffix[depth]) return;
      const availableHistogram = new Int8Array(8);
      const availableTotal = tally(left, availableHistogram);
      const ceiling = matchLevels(availableHistogram, suffixHard[depth], suffixSoft[depth]);
      if (ceiling.missing || objective(p, soft + ceiling.softScore, count + available, total + availableTotal) <= state.score()) return;
      const color = colors[depth];
      const limit = Math.min(7, available - suffix[depth + 1]);
      const histogram = new Int8Array(8);
      for (let n = limit; n >= p.minimum[color]; n--) {
        const candidates = n === available ? [left] : groups[n];
        for (const mask of candidates) {
          if ((++steps & 1023) === 0) yield;
          if (state.proven) return;
          if ((mask & left) !== mask) continue;
          if (n === available && connectedPart(mask) !== mask) continue;
          histogram.fill(0);
          const levels = tally(mask, histogram);
          const match = matchLevels(histogram, p.hard[color], p.soft[color]);
          if (match.missing) continue;
          selected[color] = mask;
          if (depth < 3) yield* colorBoard(depth + 1, left ^ mask, count + n, soft + match.softScore, total + levels);
          else if (objective(p, soft + match.softScore, count + n, total + levels) > state.score()) publishLayout();
          if (objective(p, soft + ceiling.softScore, count + available, total + availableTotal) <= state.score()) return;
        }
      }
    }

    const ids = [];
    function* place(depth, occupied, ceiling) {
      if ((++steps & 1023) === 0) yield;
      if (state.proven || ceiling <= state.score()) return;
      const left = ids.length - depth;
      const free = full ^ occupied;
      if (!left) {
        state.patterns++;
        for (let pos = 0; pos < size; pos++) levelAt[pos] = Math.min(7, gains[pos]);
        yield* colorBoard(0, free, 0, 0, 0);
        return;
      }
      if (left <= 2 && depth > 0) {
        const histogram = new Int8Array(8);
        let total = 0;
        for (const pos of p.positions) {
          if (occupied & (1 << pos)) continue;
          let gain = gains[pos];
          for (let i = depth; i < ids.length; i++) {
            const id = ids[i];
            if (p.origins[id][pos] & free) gain += powers[id];
          }
          const level = Math.min(7, gain);
          histogram[level]++;
          total += level;
        }
        const optimistic = matchLevels(histogram, p.allHard, p.totalSoft);
        const count = size - ids.length;
        if (optimistic.missing || objective(p, optimistic.softScore, count, Math.min(total, count * 7)) <= state.score()) return;
      }
      const id = ids[depth];
      for (const pos of ampCells[id]) {
        const bit = 1 << pos;
        if (occupied & bit) continue;
        ampAt[pos] = 4 + id;
        for (const target of p.effects[id][pos]) gains[target] += powers[id];
        yield* place(depth + 1, occupied | bit, ceiling);
        for (const target of p.effects[id][pos]) gains[target] -= powers[id];
        ampAt[pos] = -1;
        if (state.proven || ceiling <= state.score()) return;
      }
    }

    function* choose(start, needed, energy, ceiling) {
      if (state.proven || ceiling <= state.score()) return;
      if (!needed) {
        const targetEnergy = p.hardEnergy;
        if (energy < targetEnergy) return;
        const count = size - ids.length;
        const soft = Math.min(p.totalSoft * 7, energy - targetEnergy);
        const cap = objective(p, soft, count, Math.min(count * 7, energy));
        yield* place(0, 0, Math.min(ceiling, cap));
        return;
      }
      for (let i = start; i <= p.held.length - needed; i++) {
        const id = p.held[i];
        ids.push(id);
        yield* choose(i + 1, needed - 1, energy + p.impact[id], ceiling);
        ids.pop();
      }
    }

    for (let count = 0; count < upper.length && !state.proven; count++) {
      if (upper[count] <= state.score()) continue;
      state.testing = count;
      yield* choose(0, count, 0, upper[count]);
    }
  }

  self.onmessage = ({ data }) => {
    const p = setup(data.config);
    const evaluate = evaluator(p);
    const upper = upperBounds(p);
    const globalUpper = Math.max(-1, ...upper);
    const state = {
      best: null, near: null, tried: 0, patterns: 0, testing: null, proven: false,
      phase: 'search', seed: data.seed, continuing: Boolean(data.incumbent || data.near),
      score: () => state.best ? state.best.score : -1,
      report: type => self.postMessage({
        type: type || 'progress', best: state.best, near: state.near, tried: state.tried,
        phase: state.phase, patterns: state.patterns, testing: state.testing, proven: state.proven
      })
    };
    let pendingReport = 0;
    function inspect(board) {
      const metrics = evaluate(board);
      if (metrics.valid && metrics.score > state.score()) {
        state.best = { ...metrics, board: Array.from(board) };
        state.proven = metrics.score >= globalUpper;
        if (performance.now() > pendingReport) {
          state.report();
          pendingReport = performance.now() + 140;
        }
      } else if (!state.best && metrics.near
        && (!state.near || metrics.shortage < state.near.shortage
          || (metrics.shortage === state.near.shortage && metrics.score > state.near.score))) {
        state.near = { ...metrics, board: Array.from(board) };
      }
      return metrics;
    }
    if (data.incumbent) inspect(Int8Array.from(data.incumbent));
    if (data.near && !state.best) inspect(Int8Array.from(data.near));
    inspect(plainBoard(p));
    if (globalUpper < 0) state.proven = true;
    if (!state.proven) heuristic(p, state, inspect, 3600);
    if (!state.proven) {
      state.phase = 'exact';
      state.report();
      const iterator = exhaustive(p, state, inspect, upper);
      const pump = () => {
        const deadline = performance.now() + 95;
        while (performance.now() < deadline && !state.proven) {
          if (iterator.next().done) state.proven = true;
        }
        state.report(state.proven ? 'done' : 'progress');
        if (!state.proven) setTimeout(pump, 0);
      };
      pump();
      return;
    }
    state.report('done');
  };
}

    { name: '黄(辅助)', short: '黄', css: 'yellow' },

  ];

  const initial = () => ({

    ]

  function restore() {

            min: color.min ?? '', soft: color.soft ?? '',
            hardCount: color.hardCount ?? first?.count ?? '',
            hardLevel: String(color.hardLevel ?? first?.level ?? 7)
          };

      }

  function numberField(color, field, caption) {
    const entry = settings.colors[color];
    const label = colors[color].name + (caption || '最低数量');
    const fieldGroup = document.createElement('div');
    fieldGroup.className = 'target-field';
    const control = document.createElement('div');
    control.className = 'number-control';
    const display = document.createElement('output');
    display.className = 'setting-value';
    display.setAttribute('aria-label', label);

    if (caption) {
      const fieldLabel = document.createElement('span');
      fieldLabel.className = 'target-caption';
      fieldLabel.textContent = caption;
      fieldGroup.append(fieldLabel);
    }

    function stepButton(delta) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'number-step';
      button.textContent = delta < 0 ? '−' : '+';
      button.setAttribute('aria-label', (delta < 0 ? '减少' : '增加') + label);
      button.onclick = () => {
        const current = Number(entry[field]) || 0;
        const rounded = delta > 0 ? Math.floor(current) : Math.ceil(current);
        entry[field] = String(Math.max(0, Math.min(7, rounded + delta)));
        syncValue();
        changed();
      };
      return button;
    }

    const minus = stepButton(-1);
    const plus = stepButton(1);
    function syncValue() {
      const stored = entry[field];
      const current = Number(stored);
      const hasValue = Number.isFinite(current) && (stored !== '' || field !== 'hardLevel');
      display.value = hasValue ? String(current) : '—';
      minus.disabled = current === 0;
      plus.disabled = current === 7;
    }
    syncValue();
    control.append(minus, display, plus);
    fieldGroup.append(control);
    return fieldGroup;
  }

  function itemIcon(name) {
    return '<img class="item-icon" alt="" src="' + iconSources[name] + '">';
  }

  const colorOrder = [3, 1, 2, 0];
  function renderTargets() {
    targetFields.replaceChildren();
    colorOrder.forEach(id => {
      const color = colors[id];
      const row = document.createElement('div');
      row.className = 'target-row';
      row.innerHTML = '<div class="color-name">' + itemIcon(color.short)
        + color.name + '</div>';
      function group(title, style, ...fields) {
        const section = document.createElement('fieldset');
        section.className = 'target-group ' + style;
        const legend = document.createElement('legend');
        legend.textContent = title;
        const contents = document.createElement('div');
        contents.className = 'target-fields';
        contents.append(...fields);
        section.append(legend, contents);
        return section;
      }
      row.append(
        group('最低数量', 'minimum', numberField(id, 'min', '')),
        group('等级要求', 'required',
          numberField(id, 'hardCount', '几个组件'),
          numberField(id, 'hardLevel', '至少几级')),
        group('尽量升高', 'extra', numberField(id, 'soft', '额外几个'))
      );
      targetFields.append(row);
    });
  }

  function renderInventory() {
    const header = '<div class="stock-head" aria-hidden="true"><span>类型</span>'
      + '<span class="stock-blue">蓝</span><span class="stock-orange">橙</span></div>';
    const versions = ['蓝', '橙'];
    const rows = kinds.map((kind, type) => {
      const toggles = versions.map((version, offset) => {
        const id = type * 2 + offset;
        const checked = settings.held.includes(id) ? ' checked' : '';
        return '<label class="stock-toggle"><input type="checkbox" data-amp="' + id
          + '" aria-label="' + kind.name + ' ' + version + '（' + (offset + 1) + ' 格版）"' + checked + '></label>';
      }).join('');
      return '<div class="stock-row"><div class="kind-name">' + itemIcon(kind.name) + kind.name + '</div>' + toggles + '</div>';
    });
    const [horizontal, vertical, up, down, left, right, area, cross] = rows;
    index('inventory').innerHTML = [[up, down, left, right], [horizontal, vertical, area, cross]]
      .map(group => '<div>' + header + group.join('') + '</div>').join('');
  }

  function renderForm() {
    renderTargets();
    renderInventory();
    index('priority').value = settings.priority;
  }

  function validate() {
    function integer(value, label, required = false) {
      if (value === '' && !required) return 0;
      const n = Number(value);
      if (value === '' || !Number.isInteger(n) || n < 0 || n > 7) throw new Error(label + '须为 0 到 7 的整数。');
      return n;
    }
    let needed = 0;
    const requirements = settings.colors.map((entry, id) => {
      const label = colors[id].name;
      const min = integer(entry.min, label + '最低数量');
      const soft = integer(entry.soft, label + '「尽量升高」的数量');
      const hardCount = integer(entry.hardCount, label + '有等级要求的组件数量');
      const hardLevel = integer(entry.hardLevel, label + '要求的等级', hardCount > 0);
      if (hardCount + soft > 7) throw new Error(label + '有等级要求的组件和额外升高的组件数量合计超过了 7 个。');
      needed += Math.max(min, hardCount + soft);
      return { min, soft, hard: Array(hardCount).fill(hardLevel) };
    });
    if (needed > 25) throw new Error('各颜色合计至少需要 ' + needed + ' 个组件，棋盘只有 25 格。');
    return { colors: requirements, held: settings.held.slice(), priority: settings.priority };
  }

  function setStatus(label, kind = '') {
    if (status.textContent !== label) status.textContent = label;
    status.dataset.kind = kind;
  }

  function setNote(message, kind = '') {
    if (runNote.textContent !== message) runNote.textContent = message;
    runNote.dataset.kind = kind;
  }

  function save() {
    try { localStorage.setItem(storageKey, JSON.stringify(settings)); } catch {}
  }

  function changed() {
    if (worker) worker.terminate();
    worker = null;
    result = null;
    config = null;
    note = null;
    save();
    refresh();
  }

  function updateSetting(event) {
    const target = event.target;
    if (target.dataset.amp !== undefined) {
      const id = Number(target.dataset.amp);
      const held = new Set(settings.held);
      if (target.checked) held.add(id);
      else held.delete(id);
      settings.held = [...held].sort((a, b) => a - b);
    } else if (target.name === 'priority') {
      settings[target.name] = target.value;
    } else return;
    changed();
  }

  function describeAmp(tile) {
    const id = tile - 4;
    const type = id >> 1;
    return { ...kinds[type], type, distance: id % 2 + 1 };
  }

  function analyze(current) {
    const tiles = current.board;
    const boosts = positions.map(pos => tiles[pos] >= 4 ? describeAmp(tiles[pos]) : null);
    const coverage = boosts.map((amp, from) => amp
      ? positions.filter(to => coversCell(amp.type, amp.distance, from, to)) : []);
    const sources = positions.map(to => positions.filter(from => coverage[from].includes(to)));
    const raw = sources.map(from => from.reduce((sum, pos) => sum + boosts[pos].power, 0));
    const levels = raw.map(level => Math.min(level, 7));
    const roles = Array(25).fill(null);
    const stats = config.colors.map((counts, color) => {
      const pieces = positions.filter(pos => tiles[pos] === color)
        .sort((a, b) => levels[b] - levels[a] || a - b);
      const stats = { hard: counts.hard.length, byLevel: Array(8).fill(0) };
      for (const pos of pieces) stats.byLevel[levels[pos]]++;
      const uncovered = [];
      for (const target of counts.hard.slice().sort((a, b) => b - a)) {
        const i = pieces.findLastIndex(pos => levels[pos] >= target);
        if (i < 0) uncovered.push(target);
        else {
          roles[pieces.splice(i, 1)[0]] = { kind: 'hard', level: target };
        }
      }
      for (const target of uncovered) {
        if (!pieces.length) break;
        roles[pieces.shift()] = { kind: 'miss', level: target };
      }
      for (const pos of pieces.slice(0, counts.soft)) {
        roles[pos] = { kind: 'soft', level: levels[pos] };
      }
      return stats;
    });
    return { tiles, boosts, levels, roles, stats };
  }

  function coordinate(pos) {
    return '第 ' + (Math.floor(pos / 5) + 1) + ' 行第 ' + (pos % 5 + 1) + ' 列';
  }

  function roleDescription(role) {
    if (role.kind === 'hard') return '等级要求为 ' + role.level + ' 级';
    if (role.kind === 'miss') return '未达到 ' + role.level + ' 级目标';
    return '尽量升高';
  }

  function renderBoard(current) {
    const signature = current ? current.board.join(',') : '-';
    if (renderedBoard === signature) return;
    renderedBoard = signature;
    layout = current ? analyze(current) : null;
    const cells = ['<span class="axis" aria-hidden="true"></span>'];
    for (let i = 1; i <= 5; i++) cells.push('<span class="axis" aria-hidden="true">' + i + '</span>');
    for (const pos of positions) {
      if (pos % 5 === 0) cells.push('<span class="axis" aria-hidden="true">' + (pos / 5 + 1) + '</span>');
      const value = layout ? layout.tiles[pos] : -1;
      const label = coordinate(pos);
      let html = '';
      let css = '';
      let detail = '空格';
      if (value >= 4) {
        const amp = layout.boosts[pos];
        css = 'amplifier';
        html = itemIcon(amp.name) + '<span class="tile-caption">'
          + amp.short + ' · ' + amp.distance + '格</span>';
        detail = amp.name + ' ' + amp.distance + ' 格增幅器，+' + amp.power + ' 级';
      } else if (value >= 0) {
        const color = colors[value];
        const level = layout.levels[pos];
        const role = layout.roles[pos];
        css = color.css;
        if (pos % 5 < 4 && layout.tiles[pos + 1] === value) css += ' connected-right';
        if (pos < 20 && layout.tiles[pos + 5] === value) css += ' connected-down';
        html = '<span class="tile-level">' + level + '</span><span class="tile-caption">' + color.short + '</span>';
        detail = color.name + '组件 ' + level + ' 级';
        if (role) {
          html += '<span class="role-mark ' + role.kind + '">' + ({hard: '必', soft: '优', miss: '缺'})[role.kind] + '</span>';
          detail += '，' + roleDescription(role);
        }
      }
      cells.push('<div role="img" aria-label="' + label + '，' + detail + '" class="tile ' + css + '">' + html + '</div>');
    }
    board.innerHTML = cells.join('');
  }

  function refreshOverview(current) {
    const open = Boolean(current);
    index('overview').hidden = !open;
    if (!open) return;
    const stats = layout.stats;
    const hard = stats.reduce((sum, entry) => sum + entry.hard, 0);
    const soft = config.colors.reduce((sum, entry) => sum + entry.soft, 0);
    index('parts-metric').textContent = current.count + ' / 25';
    index('hard-metric').textContent = hard ? (hard - current.missing) + ' / ' + hard : '—';
    index('soft-metric').textContent = soft ? current.soft + ' / ' + soft * 7 : '—';
    index('summary').innerHTML = colorOrder.map(id => {
      const color = colors[id];
      const cells = stats[id].byLevel.slice().reverse().map(count =>
        count ? '<td>' + count + '</td>' : '<td class="empty">0</td>');
      return '<tr><th scope="row"><span class="color-dot ' + color.css + '"></span>'
        + color.name + '</th>' + cells.join('') + '</tr>';
    }).join('');
  }

  function refresh() {
    const current = result?.best || result?.near || null;
    const goalBadge = index('goal-met');
    goalBadge.classList.toggle('unmet', !result?.best);
    goalBadge.textContent = result?.best ? '已满足要求' : '未满足要求';
    renderBoard(current);
    refreshOverview(current);
    board.classList.toggle('is-searching', Boolean(worker) && result?.phase !== 'exact');
    actions.solve.disabled = Boolean(worker);
    actions.action.hidden = !worker;
    if (note) {
      setStatus(note.title, 'warn');
      setNote(note.detail, 'warn');
    } else if (worker) {
      setStatus(result?.phase === 'exact' ? '正在验证' : '正在计算', 'busy');
      if (result?.phase === 'exact') {
        const scope = result.testing === null ? '正在筛选需要验证的增幅器组合'
          : '正在检查使用 ' + result.testing + ' 个增幅器的摆法';
        const goal = result.best
          ? '是否更优'
          : '是否满足要求';
        setNote(scope + goal, 'verify');
      } else {
        setNote(result?.best
          ? '已找到达标方案，正在尝试提高方案得分'
          : '正在尝试不同的摆放组合', 'search');
      }
    } else if (result?.proven) {
      setStatus(result.best ? '已证最优' : '无可行解', result.best ? 'good' : 'warn');
      setNote(result.best ? '已验证当前配置下的最优方案。' : '已验证这份配置无法满足全部等级要求和数量条件。', result.best ? '' : 'warn');
    } else if (result) {
      setStatus('已停止计算');
      setNote(result.best ? '已保留当前最佳方案，尚未证实最优。' : '尚未找到达标方案。');
    } else {
      setStatus('等待计算');
      setNote('修改配置后点击「开始计算」。');
    }
  }

  function start() {
    if (worker) return;
    config = null;
    note = null;
    try {
      config = validate();
    } catch (error) {
      result = null;
      note = { title: '请检查配置', detail: error.message };
      refresh();
      return;
    }
    const previous = result;
    const source = '(' + solverWorker.toString() + ')(' + coversCell.toString() + ', ' + JSON.stringify(kinds) + ');';
    const workerUrl = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
    try {
      worker = new Worker(workerUrl);
    } catch {
      note = { title: '无法启动计算', detail: '请下载文件后，用 Chrome、Edge 或 Firefox 打开。' };
    } finally {
      URL.revokeObjectURL(workerUrl);
    }
    if (!worker) {
      refresh();
      return;
    }
    const running = worker;
    running.onmessage = ({ data }) => {
      if (worker !== running) return;
      result = data;
      if (data.type === 'done') {
        running.terminate();
        worker = null;
      }
      refresh();
    };
    running.onerror = () => {
      if (worker !== running) return;
      running.terminate();
      worker = null;
      note = { title: '计算中断', detail: '请重新计算。如果仍然中断，请下载文件后在浏览器打开。' };
      refresh();
    };
    running.postMessage({
      config,
      seed: previous ? Date.now() >>> 0 : 3623,
      incumbent: previous?.best?.board, near: previous?.near?.board
    });
    refresh();
  }

  form.addEventListener('input', updateSetting);
  index('priority').addEventListener('input', updateSetting);
  form.addEventListener('submit', event => {
    event.preventDefault();
    start();
    if (matchMedia('(max-width: 860px)').matches) {
      index('board-title').scrollIntoView({ block: 'start', behavior: 'instant' });
    }
  });
  index('select-all-amps').onclick = () => {
    settings.held = allAmpIds();
    renderInventory();
    changed();
  };
  // 按界面上的橙、绿、黄、红排列，每项为最低数量、等级要求数量、额外升高数量。
  const presets = {
    healthIdle:  [[7, 2, 0], [7, 1, 0], [2, 1, 0], [2, 2, 0]],
    healthArena: [[7, 2, 0], [7, 1, 0], [5, 2, 0], [0, 0, 0]],
    attackIdle:  [[7, 3, 0], [0, 0, 0], [7, 1, 0], [0, 2, 1]],
    attackArena: [[7, 3, 0], [0, 0, 0], [7, 3, 0], [0, 0, 0]]
  };
  document.querySelectorAll('[data-preset]').forEach(button => {
    button.onclick = () => {
      presets[button.dataset.preset].forEach(([min, hardCount, soft], row) => {
        settings.colors[colorOrder[row]] = {
          min: String(min), hardCount: String(hardCount), hardLevel: '7', soft: String(soft)
        };
      });
      changed();
      renderTargets();
      start();
    };
  });
  actions.action.onclick = () => {
    worker.terminate();
    worker = null;
    if (!result) result = { best: null, near: null, proven: false };
    refresh();
  };
  renderForm();
  refresh();
})();

</script>
